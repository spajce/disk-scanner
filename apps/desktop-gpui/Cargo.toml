[package]
name = "desktop-gpui"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "disk-scanner"
path = "src/main.rs"

[dependencies]
gpui = "0.2"
disk-scan = { path = "../../crates/disk-scan" }
rayon = "1.10"

[build-dependencies]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
