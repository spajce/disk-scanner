[workspace]
resolver = "2"
members = ["apps/desktop-gpui", "crates/disk-scan"]
exclude = ["src-tauri"]

# The window layer pulls in an old `xattr` through its tar reader, and that
# release refers to `libc::ENOATTR`, which libc no longer defines on Linux.
# The vendored copy is the same crate with that one constant mapped to
# `ENODATA` there, so Linux builds compile; every other platform is unchanged.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

# The walker is unusable at opt-level 0 (megabytes per second); keep the
# scanner fast while iterating on the UI.
[profile.dev.package.disk-scan]
opt-level = 2

[profile.dev.package.rayon-core]
opt-level = 2
