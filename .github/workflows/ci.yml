name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: disk-scanner-windows-x64
          - name: macOS
            os: macos-latest
            artifact: disk-scanner-macos-arm64
          - name: Linux
            os: ubuntu-latest
            artifact: disk-scanner-linux-x64

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      # The window layer links against the system's X11/Wayland, font and GL
      # stack, so the development packages have to be present before cargo
      # builds anything that touches them.
      - name: Install the Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype6-dev libglib2.0-dev libgtk-3-dev \
            libvulkan-dev libssl-dev libzstd-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      - name: Build
        run: cargo build --locked --bin disk-scanner

      - name: Test
        run: cargo test --locked
