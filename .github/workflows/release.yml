name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            package: windows-x64
          - name: macOS
            os: macos-latest
            package: macos-arm64
          - name: Linux
            os: ubuntu-latest
            package: linux-x64

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The window layer links against the system's X11/Wayland, font and GL
      # stack, so the development packages have to be present before cargo
      # builds anything that touches them.
      - name: Install the Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype6-dev libglib2.0-dev libgtk-3-dev \
            libvulkan-dev libssl-dev libzstd-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build the desktop app
        run: cargo build --release --locked --bin disk-scanner

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $stage = "stage/disk-scanner-$tag-${{ matrix.package }}"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item target/release/disk-scanner.exe $stage/
          Copy-Item README.md $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/disk-scanner-$tag-${{ matrix.package }}.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          stage="stage/disk-scanner-$tag-${{ matrix.package }}"
          mkdir -p "$stage" dist
          cp target/release/disk-scanner "$stage/"
          cp README.md "$stage/"
          tar -czf "dist/disk-scanner-$tag-${{ matrix.package }}.tar.gz" -C stage "$(basename "$stage")"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Collect the archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Disk Scanner ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Native disk-usage explorer: sunburst rings, treemap, heatmap and a details table
            over the same scanned volume.

            **Windows** — unpack `disk-scanner-*-windows-x64.zip` and run `disk-scanner.exe`.
            No installer and no runtime to download; the only requirement is the Microsoft
            Visual C++ Redistributable (already present on virtually every Windows install).

            **macOS** — unpack `disk-scanner-*-macos-arm64.tar.gz` and run `disk-scanner`.
            The binary is not notarised, so the first launch needs *right-click → Open*.

            **Linux** — unpack `disk-scanner-*-linux-x64.tar.gz` and run `./disk-scanner`.
            The X11/Wayland, font and GL runtime libraries come from the distribution.

            Built from source by GitHub Actions on `windows-latest`, `macos-latest` and
            `ubuntu-latest` with the release profile (`lto`, `opt-level = "s"`, stripped).
          files: |
            dist/*
          fail_on_unmatched_files: true
